<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENDI APRIZAL - DASHBORD MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #facc15; --card-bg: rgba(10, 10, 10, 0.85); --glow: rgba(250, 204, 21, 0.8); }
        .gold-theme { --accent: #d4af37; --card-bg: rgba(15, 12, 0, 0.9); --glow: rgba(212, 175, 55, 0.8); }

        #dynamicBg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; transition: 0.8s; }
        #bgOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.85)); }
        
        body { font-family: 'Poppins', sans-serif; color: white; height: 100vh; overflow: hidden; margin: 0; transition: 0.3s; }
        .font-master { font-family: 'Orbitron', sans-serif; }
        
        .sidebar-luxury { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; text-transform: uppercase; font-size: 10px; font-weight: 700; transition: 0.3s; border-left: 3px solid transparent; }
        .sidebar-luxury.active { color: #fff; background: linear-gradient(90deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%); border-left: 3px solid var(--accent); text-shadow: 0 0 10px var(--glow); }

        #mainContent { display: flex; flex-direction: column; width: 100%; height: 100vh; overflow-y: auto; scroll-behavior: smooth; }
        .grid-layout { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; width: 100%; }
        .list-layout { display: flex !important; flex-direction: column !important; gap: 12px; width: 100%; max-width: 1200px; }
        
        .settings-layout { display: flex !important; align-items: center; justify-content: center; width: 100%; min-height: 70vh; }

        .master-card { background: var(--card-bg); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 28px; width: 100%; height: 420px; display: flex; flex-direction: column; padding: 22px; box-sizing: border-box; }
        
        /* Dropdown fix */
        select option { background-color: #111 !important; color: #fff !important; }

        .alarm-card { background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.5)); border: 1px solid rgba(250, 204, 21, 0.2); border-radius: 24px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; height: 220px; transition: 0.3s; }
        .alarm-card:hover { border-color: var(--accent); box-shadow: 0 0 30px var(--glow); }

        .display-input-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; width: 100%; transition: 0.3s; }
        
        .pasaran-row { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 18px 25px; display: flex; align-items: center; transition: 0.3s; }
        .pasaran-alert { border: 2px solid var(--accent) !important; box-shadow: 0 0 25px var(--glow); }
        .text-alert { color: var(--accent) !important; text-shadow: 0 0 10px var(--glow); font-weight: 900; }
        
        .note-display-box { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 18px; padding: 18px; flex-grow: 1; overflow-y: auto; font-size: 10px; line-height: 1.7; font-family: 'JetBrains Mono', monospace; font-style: italic; white-space: pre-wrap; }
        .neon-clock { font-family: 'Orbitron', sans-serif; color: var(--accent); text-shadow: 0 0 20px var(--glow); }
        
        #loadingOverlay { position: fixed; inset: 0; background: black; z-index: 99999; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; color: var(--accent); font-size: 11px; gap: 15px; letter-spacing: 3px; }
        #imgPreviewModal { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 10000; display: none; align-items: center; justify-content: center; cursor: zoom-out; padding: 20px; }
        #imgPreviewModal img { max-width: 100%; max-height: 95vh; border-radius: 5px; }
        .custom-checkbox { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }

        .sticky-header-container {
            position: sticky; top: -40px; z-index: 100;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(25px);
            margin: -40px -40px 30px -40px; padding: 40px 40px 15px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .summary-info-box {
            position: fixed; 
            right: 60px; 
            top: 310px; 
            width: 450px; 
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; 
            padding: 35px; 
            backdrop-filter: blur(30px); 
            z-index: 40;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* TIMER CSS DI LIST: BESAR & TEBAL */
        .countdown-badge { 
            background: #ef4444; color: white; padding: 6px 16px; border-radius: 10px; 
            font-family: 'Orbitron'; font-size: 14px; 
            font-weight: 900; margin-left: 20px; 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); animation: pulseTimer 1s infinite;
        }
        @keyframes pulseTimer { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* NOTIFIKASI ALARM */
        #alarmToast {
            position: fixed; bottom: 30px; right: 30px; width: 400px;
            background: #000; border-left: 6px solid var(--accent); border-radius: 20px;
            padding: 25px; box-shadow: 0 30px 100px rgba(0,0,0,1); z-index: 10000;
            display: none; animation: slideInNotif 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideInNotif { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="flex">

    <div id="loadingOverlay">INITIALIZING CLOUD VAULT...</div>

    <div id="imgPreviewModal" onclick="closeImgPreview()">
        <img id="imgFull" src="">
        <div class="absolute top-10 right-10 text-white text-3xl"><i class="fas fa-times"></i></div>
    </div>

    <div id="dynamicBg"></div>
    <div id="bgOverlay"></div>

    <div id="loginScreen" class="fixed inset-0 flex items-center justify-center p-4 z-[9999] bg-cover bg-center">
        <div class="bg-black/90 backdrop-blur-3xl w-full max-w-4xl flex flex-col md:flex-row overflow-hidden border border-white/10 rounded-[40px]">
            <div id="loginSideImg" class="hidden md:block w-1/2 m-4 rounded-[30px] bg-cover bg-center"></div>
            <div class="flex-1 p-12 text-center">
                <h1 class="font-master text-xl font-black mb-1 tracking-[4px]">MASTER <span class="text-yellow-400">LOGIN</span></h1>
                <div class="space-y-4 text-left mt-10">
                    <input type="text" id="manualUser" placeholder="USERNAME" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:border-yellow-400 text-white font-bold text-xs uppercase">
                    <input type="password" id="manualPass" placeholder="PASSWORD" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:border-yellow-400 text-white font-bold text-xs uppercase">
                    <button onclick="handleLogin()" class="w-full py-4 rounded-xl bg-yellow-400 text-black font-black uppercase text-[10px] tracking-widest mt-6">Unlock</button>
                </div>
            </div>
        </div>
    </div>

    <aside class="w-72 h-screen bg-black/40 backdrop-blur-3xl flex flex-col border-r border-white/5 z-50">
        <div class="p-8 border-b border-white/5 text-center">
            <h2 class="font-master text-lg font-black text-white tracking-tighter uppercase">RENDI APRIZAL</h2>
            <div class="flex items-center justify-center gap-2 mt-4 text-[8px] font-bold text-gray-400 uppercase tracking-widest">
                <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div> Secure Cloud
            </div>
        </div>
        <div class="flex-grow overflow-y-auto custom-scrollbar p-4" id="sidebarMenu"></div>
        <div class="p-6 space-y-3 border-t border-white/5">
            <button onclick="openMenuModal()" class="w-full py-3 rounded-xl border border-white/10 text-white text-[9px] font-bold tracking-[3px] hover:bg-white hover:text-black transition uppercase"><i class="fas fa-folder-plus mr-2"></i> New Folder</button>
            <button onclick="switchMenu('ALARM CENTER')" class="w-full py-3 bg-yellow-400/10 text-yellow-400 border border-yellow-400/20 rounded-xl text-[9px] font-bold tracking-[3px] uppercase"><i class="fas fa-bell mr-2"></i> Alarm Center</button>
            <button onclick="switchMenu('SETTINGS')" class="w-full py-3 bg-blue-600/10 text-blue-400 rounded-xl text-[9px] font-bold tracking-[3px] uppercase"><i class="fas fa-cog mr-2"></i> Settings</button>
            <button onclick="logout()" class="w-full py-2 text-[8px] text-gray-600 font-bold uppercase tracking-widest hover:text-red-500 transition text-center">Logout</button>
        </div>
    </aside>

    <main id="mainContent" class="flex-grow custom-scrollbar p-10">
        <div class="sticky-header-container">
            <div class="flex justify-between items-start mb-10 w-full">
                <div>
                    <h1 id="currentMenuTitle" class="font-master text-4xl font-black uppercase tracking-tighter italic">VAULT</h1>
                    <div id="pasaranCounter" class="hidden mt-2 flex items-center gap-3"></div>
                    <div class="h-1 w-20 mt-2" id="headerLine" style="background:var(--accent)"></div>
                </div>
                <div class="text-right bg-black/20 backdrop-blur-xl px-6 py-3 rounded-2xl border border-white/10">
                    <div id="clockTime" class="neon-clock text-2xl font-black tracking-widest">00:00:00</div>
                    <div id="clockDate" class="text-[9px] text-gray-400 font-bold uppercase tracking-[3px] mt-1">-- --- ----</div>
                </div>
            </div>
            <div id="searchArea" class="flex flex-col lg:flex-row justify-between items-center mb-10 gap-4 w-full">
                <div class="relative w-full lg:w-[450px]">
                    <input type="text" id="searchInput" oninput="renderCards()" placeholder="Search..." class="w-full bg-black/20 border border-white/10 pl-12 pr-4 py-4 rounded-xl outline-none focus:border-yellow-400 text-sm font-bold text-white">
                    <i class="fas fa-search absolute left-5 top-4.5 text-yellow-400"></i>
                </div>
                <button onclick="openDataModal()" class="px-12 py-4 text-[10px] font-black uppercase rounded-xl" style="background:var(--accent); color:black">Add Entry</button>
            </div>
        </div>

        <div id="summaryWidget" class="summary-info-box hidden">
            <div id="summaryWidgetContent" class="font-master text-[16px] font-black uppercase space-y-6 tracking-tighter italic"></div>
        </div>

        <div id="cardGrid"></div>
        <div id="emptyState" class="hidden text-center py-40 opacity-10 font-master text-4xl uppercase">Empty</div>
    </main>

    <div id="alarmToast">
        <button onclick="closeAlarmToast()" class="absolute top-4 right-4 text-white/40 hover:text-white transition-all text-xl">
            <i class="fas fa-times"></i>
        </button>
        <div class="flex items-center gap-6">
            <div class="w-16 h-16 bg-yellow-400 flex items-center justify-center rounded-2xl text-black text-3xl shadow-2xl animate-bounce">
                <i class="fas fa-bell"></i>
            </div>
            <div class="flex-grow">
                <div id="notifType" class="font-master text-[10px] text-yellow-400 font-black tracking-[5px] uppercase mb-1">SYSTEM ALERT</div>
                <div id="notifMsg" class="font-bold text-white text-lg uppercase leading-tight italic">PASARAN RESULT!</div>
                <div id="notifNext" class="text-[10px] text-gray-500 font-bold uppercase mt-4 pt-3 border-t border-white/10"></div>
            </div>
        </div>
    </div>

    <div id="dataModal" class="fixed inset-0 bg-black/95 hidden z-[1000] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-black border border-yellow-400/30 rounded-[40px] w-full max-w-2xl overflow-hidden">
            <div class="bg-yellow-400 p-6 flex justify-between items-center text-black">
                <h3 class="font-black text-[12px] uppercase font-master italic tracking-widest">Entry Configuration</h3>
                <button onclick="closeDataModal()" class="text-xl"><i class="fas fa-times"></i></button>
            </div>
            <form id="vaultForm" class="p-10 space-y-6">
                <input type="hidden" id="editIndex">
                <input type="text" id="inputTitle" required placeholder="TITLE / NAMA ITEM" class="w-full bg-white/5 border border-white/10 p-5 rounded-xl outline-none focus:border-yellow-400 text-white font-bold text-base uppercase">
                
                <div id="alarmFields" class="hidden space-y-5">
                    <div class="grid grid-cols-2 gap-5">
                        <select id="inputDay" class="w-full bg-white/5 border border-white/10 p-5 rounded-xl text-white text-sm font-bold uppercase outline-none focus:border-yellow-400">
                            <option value="DAILY">SETIAP HARI</option>
                            <option value="Senin">SENIN</option>
                            <option value="Selasa">SELASA</option>
                            <option value="Rabu">RABU</option>
                            <option value="Kamis">KAMIS</option>
                            <option value="Jumat">JUMAT</option>
                            <option value="Sabtu">SABTU</option>
                            <option value="Minggu">MINGGU</option>
                        </select>
                        <input type="time" id="inputAlarmTime" class="w-full bg-white/5 border border-white/10 p-5 rounded-xl text-white text-base font-bold outline-none focus:border-yellow-400">
                    </div>
                </div>

                <div id="accountFields" class="hidden space-y-5">
                    <input type="text" id="inputUser" placeholder="USERNAME" class="w-full bg-white/5 border border-white/10 p-5 rounded-xl text-white font-bold text-sm uppercase">
                    <input type="text" id="inputPass" placeholder="PASSWORD" class="w-full bg-white/5 border border-white/10 p-5 rounded-xl text-white font-bold text-sm uppercase">
                </div>
                <div id="lotteryFields" class="hidden space-y-5">
                    <div class="grid grid-cols-2 gap-5">
                        <input type="time" id="inputClose" class="w-full bg-white/5 border border-white/10 p-5 rounded-xl text-white text-base">
                        <input type="time" id="inputResult" class="w-full bg-white/5 border border-white/10 p-5 rounded-xl text-white text-base">
                    </div>
                </div>
                <input type="url" id="inputLink" placeholder="LINK URL" class="w-full bg-white/5 border border-white/10 p-5 rounded-xl text-yellow-400 font-bold text-sm">
                <div id="imageFields" class="hidden"><input type="file" id="inputImageFile" accept="image/*" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-sm text-gray-400 font-bold"></div>
                <div id="noteFields" class="hidden"><textarea id="inputContent" rows="6" placeholder="CONTENT..." class="w-full bg-white/5 border border-white/10 p-5 rounded-xl text-white text-sm font-code"></textarea></div>
                <button type="submit" id="btnSave" class="w-full py-5 bg-yellow-400 text-black font-black rounded-xl uppercase text-[12px] tracking-widest mt-4">Save Configuration</button>
            </form>
        </div>
    </div>

    <div id="menuModal" class="fixed inset-0 bg-black/95 hidden z-[1001] flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="p-12 rounded-[40px] w-full max-w-2xl text-center border border-white/10 bg-black/90">
            <h3 class="font-master text-2xl font-black text-white mb-8 uppercase italic tracking-widest">Create Folder</h3>
            <div class="space-y-6 text-left">
                <input type="text" id="newMenuName" placeholder="FOLDER NAME" class="w-full bg-white/5 border border-white/10 p-5 rounded-xl outline-none focus:border-yellow-400 font-bold text-white text-base uppercase">
                <select id="newMenuType" class="w-full bg-white/5 border border-white/10 p-5 rounded-xl outline-none text-yellow-400 font-bold text-base">
                    <option value="account">MODE AKUN</option>
                    <option value="note">MODE CATATAN</option>
                    <option value="image">MODE FOTO</option>
                    <option value="image_note">MODE FOTO & CATATAN</option>
                    <option value="lottery">MODE PASARAN</option>
                </select>
            </div>
            <button onclick="addNewMenu()" class="w-full py-5 mt-10 bg-yellow-400 text-black font-black rounded-xl uppercase text-[12px] tracking-widest">Generate Folder</button>
            <button onclick="closeMenuModal()" class="mt-6 text-gray-500 text-[10px] font-bold uppercase tracking-[4px]">Cancel Operation</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD6XZ3t40TDWRfPd_ml-ImlIjS4DNIKlAw",
            authDomain: "vaultrendi.firebaseapp.com",
            databaseURL: "https://vaultrendi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vaultrendi",
            storageBucket: "vaultrendi.firebasestorage.app",
            messagingSenderId: "655144751558",
            appId: "1:655144751558:web:aa86b6984b7b7b177be2c7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let MASTER_USER = "admin"; let MASTER_PASS = "master123";
        let BG_LOGIN = ""; let BG_DASH = ""; let THEME = "dark";
        let menus = [{ name: "DATA LOGIN", type: "account" }];
        let masterData = []; let activeMenu = "DATA LOGIN";

        function syncFromFirebase() {
            db.ref('vault_v10').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    menus = data.menus || menus; masterData = data.masterData || [];
                    MASTER_USER = data.settings?.user || "admin"; MASTER_PASS = data.settings?.pass || "master123";
                    BG_LOGIN = data.settings?.bgLogin || ""; BG_DASH = data.settings?.bgDash || "";
                    THEME = data.settings?.theme || "dark";
                }
                document.getElementById('loadingOverlay').style.display = 'none';
                applySettings(); renderSidebar(); renderCards();
            });
        }

        function syncToFirebase() {
            db.ref('vault_v10').set({ menus, masterData, settings: { user: MASTER_USER, pass: MASTER_PASS, bgLogin: BG_LOGIN, bgDash: BG_DASH, theme: THEME } });
        }

        function applySettings() {
            const dImg = "https://cdn.areabermain.club/assets/cdn/azdev/2026/08/01/20260801/88c44b3419d36c37925d97b2ae3c427c/screenshot-1.jpg";
            document.getElementById('loginScreen').style.backgroundImage = `url('${BG_LOGIN || dImg}')`;
            document.getElementById('loginSideImg').style.backgroundImage = `url('${BG_LOGIN || dImg}')`;
            document.getElementById('dynamicBg').style.backgroundImage = `url('${BG_DASH || dImg}')`;
            document.body.className = THEME === 'gold' ? 'gold-theme flex' : 'flex';
        }

        function handleLogin() {
            if(document.getElementById('manualUser').value === MASTER_USER && document.getElementById('manualPass').value === MASTER_PASS) {
                document.getElementById('loginScreen').style.display = 'none';
            } else { alert('Wrong Credentials'); }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('clockDate').innerText = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
            checkAlarms();
            updateTimers();
            const mInfo = menus.find(m => m.name === activeMenu);
            if(mInfo && mInfo.type === 'lottery') {
                const search = document.getElementById('searchInput').value.toLowerCase();
                const filtered = masterData.filter(d => d.category === activeMenu && d.title.toLowerCase().includes(search));
                updateSummaryWidget(filtered);
            }
        }
        setInterval(updateClock, 1000); updateClock();

        document.onkeydown = function(e) {
            if(e.key === "Escape") { closeImgPreview(); closeDataModal(); closeMenuModal(); closeAlarmToast(); }
        };

        function viewFullImage(src) { document.getElementById('imgFull').src = src; document.getElementById('imgPreviewModal').style.display = 'flex'; }
        function closeImgPreview() { document.getElementById('imgPreviewModal').style.display = 'none'; }

        function renderSidebar() {
            const container = document.getElementById('sidebarMenu'); container.innerHTML = '';
            menus.forEach(m => {
                const div = document.createElement('div');
                div.className = `sidebar-luxury p-4 mb-2 rounded-xl cursor-pointer flex justify-between items-center ${activeMenu === m.name ? 'active' : 'text-gray-400/60 hover:bg-white/5'}`;
                let icon = m.type === 'account' ? 'fa-shield-alt' : m.type === 'note' ? 'fa-sticky-note' : m.type.includes('image') ? 'fa-image' : 'fa-dice';
                div.innerHTML = `<span onclick="switchMenu('${m.name}')"><i class="fas ${icon} mr-3"></i> ${m.name}</span>
                                ${m.name !== 'DATA LOGIN' ? `<i onclick="deleteMenu('${m.name}')" class="fas fa-trash-alt text-[8px] opacity-20 hover:opacity-100 hover:text-red-500"></i>` : ''}`;
                container.appendChild(div);
            });
        }

        function switchMenu(name) {
            activeMenu = name; document.getElementById('currentMenuTitle').innerText = activeMenu;
            const grid = document.getElementById('cardGrid');
            if(activeMenu === 'SETTINGS') { 
                document.getElementById('searchArea').classList.add('hidden'); grid.className = "settings-layout"; renderSettings(); 
            } else { 
                document.getElementById('searchArea').classList.remove('hidden'); grid.className = "grid-layout"; renderSidebar(); renderCards(); 
            }
        }

        function isTimeClose(timeStr) {
            if(!timeStr) return false;
            const now = new Date(); const [h, m] = timeStr.split(':').map(Number);
            const target = new Date(); target.setHours(h, m, 0);
            let diff = (target - now) / 1000 / 60; return diff >= 0 && diff <= 30;
        }

        function toggleDone(idx) { masterData[idx].isDone = !masterData[idx].isDone; syncToFirebase(); }
        function toggleHide(idx) { masterData[idx].isHidden = !masterData[idx].isHidden; syncToFirebase(); }
        function uncheckAll() { if(confirm('Reset All?')) { masterData.forEach(i => { if(i.category === activeMenu) i.isDone = false; }); syncToFirebase(); } }

        function renderCards() {
            const grid = document.getElementById('cardGrid'); grid.innerHTML = '';
            const search = document.getElementById('searchInput').value.toLowerCase();
            const counterEl = document.getElementById('pasaranCounter');
            
            if(activeMenu === 'ALARM CENTER') {
                grid.className = "grid-layout";
                counterEl.classList.add('hidden');
                document.getElementById('summaryWidget').classList.add('hidden');
                masterData.filter(d => d.category === 'ALARM CENTER' && d.title.toLowerCase().includes(search)).forEach(item => {
                    const idx = masterData.indexOf(item);
                    const card = document.createElement('div');
                    card.className = "alarm-card";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div><div class="text-[10px] text-yellow-400 font-bold tracking-widest uppercase mb-1">${item.day || 'DAILY'}</div><h3 class="font-master text-sm font-black italic">${item.title}</h3></div>
                            <div class="flex gap-4">
                                <button onclick="edit(${idx})"><i class="fas fa-pen opacity-20 hover:opacity-100"></i></button>
                                <button onclick="del(${idx})"><i class="fas fa-trash opacity-20 hover:opacity-100"></i></button>
                            </div>
                        </div>
                        <div class="flex justify-between items-end">
                            <div class="font-master text-4xl font-black text-white tracking-widest">${item.alarmTime || '00:00'}</div>
                            <div class="flex items-center gap-2 text-[9px] font-bold text-gray-500 uppercase tracking-widest">
                                <input type="checkbox" ${!item.isHidden ? 'checked' : ''} onchange="toggleHide(${idx})" class="custom-checkbox"> ${item.isHidden ? 'OFF' : 'ON'}
                            </div>
                        </div>`;
                    grid.appendChild(card);
                });
                return;
            }

            const mInfo = menus.find(m => m.name === activeMenu); if(!mInfo) return;
            let filtered = masterData.filter(d => d.category === activeMenu && d.title.toLowerCase().includes(search));

            if(mInfo.type === 'lottery') {
                grid.className = "list-layout"; filtered.sort((a, b) => (a.closeTime || "99:99").localeCompare(b.closeTime || "99:99"));
                counterEl.classList.remove('hidden');
                counterEl.innerHTML = `<div class="text-white text-[9px] font-bold bg-white/10 px-3 py-1 rounded-full border border-white/20" style="color:var(--accent); border-color:var(--accent)">${filtered.filter(d => d.isDone).length} / ${filtered.length} DONE</div><button onclick="uncheckAll()" class="text-red-500 text-[8px] uppercase font-bold bg-red-500/10 px-3 py-1 rounded-full border border-red-500/20">Reset</button>`;
                updateSummaryWidget(filtered);
            } else { 
                grid.className = "grid-layout"; counterEl.classList.add('hidden'); 
                document.getElementById('summaryWidget').classList.add('hidden');
            }

            filtered.forEach((item) => {
                const rIndex = masterData.indexOf(item); const card = document.createElement('div');
                if(mInfo.type === 'lottery') {
                    const isAlert = isTimeClose(item.resultTime);
                    card.className = `pasaran-row ${isAlert ? 'pasaran-alert' : ''} ${item.isDone || item.isHidden ? 'opacity-30 grayscale' : ''}`;
                    card.innerHTML = `<div class="flex items-center gap-6 w-[350px] shrink-0">
                        <h3 class="font-master text-[12px] font-black uppercase truncate ${isAlert ? 'text-alert' : ''}">${item.title}</h3>
                        <div id="tm-${rIndex}"></div>
                    </div>
                    <div class="flex gap-10 text-[10px] font-bold font-code shrink-0 mr-8">
                        <div class="${isAlert ? 'text-alert' : ''}" style="color:var(--accent)">CLOSE: <span class="text-white">${item.closeTime || '--:--'}</span></div>
                        <div class="${isAlert ? 'text-alert animate-pulse' : ''}" style="color:var(--accent)">RESULT: <span class="text-white">${item.resultTime || '--:--'}</span></div>
                    </div>
                    <div class="flex items-center gap-5 flex-grow justify-end">
                        <a href="${item.link}" target="_blank" class="border px-5 py-2 rounded-lg text-[10px] font-bold" style="color:var(--accent); border-color:var(--accent)">Link</a>
                        <div class="flex gap-5 items-center border-l border-white/10 pl-6">
                            <button onclick="toggleHide(${rIndex})"><i class="fas ${item.isHidden ? 'fa-eye-slash' : 'fa-eye'} opacity-30 text-[11px]"></i></button>
                            <button onclick="edit(${rIndex})"><i class="fas fa-pen opacity-30 text-[11px]"></i></button>
                            <button onclick="del(${rIndex})"><i class="fas fa-trash opacity-30 text-[11px]"></i></button>
                            <input type="checkbox" ${item.isDone ? 'checked' : ''} onchange="toggleDone(${rIndex})" class="custom-checkbox ml-2">
                        </div>
                    </div>`;
                } else {
                    card.className = "master-card"; let contentBody = '';
                    if(mInfo.type === 'account') {
                        contentBody = `<div class="flex flex-col gap-3 mt-4">
                            <div class="display-input-box"><span class="text-[10px] font-bold truncate w-4/5 italic">${item.user}</span><button onclick="copyVal(${rIndex}, 'user', this)" class="opacity-30 hover:opacity-100"><i class="fas fa-clone"></i></button></div>
                            <div class="display-input-box"><span class="text-[10px] font-bold w-4/5">********</span><button onclick="copyVal(${rIndex}, 'pass', this)" class="opacity-30 hover:opacity-100"><i class="fas fa-clone"></i></button></div>
                            <div class="display-input-box border-yellow-400/20"><span class="text-[9px] font-bold text-white/40 truncate w-4/5 italic">${item.link || 'No Link'}</span><button onclick="copyVal(${rIndex}, 'link', this)" class="text-yellow-400/30 hover:text-yellow-400"><i class="fas fa-copy"></i></button></div>
                            <a href="${item.link}" target="_blank" class="block w-full py-4 text-black rounded-2xl text-[10px] font-black text-center uppercase tracking-widest mt-2 transition hover:opacity-80" style="background:var(--accent)">Visit Link</a>
                        </div>`;
                    } else if(mInfo.type === 'image') {
                        contentBody = `<div class="mt-4 flex-grow rounded-xl overflow-hidden border border-white/10 cursor-zoom-in bg-black/20" onclick="viewFullImage('${item.image}')"><img src="${item.image}" class="w-full h-full object-cover"></div>`;
                    } else if(mInfo.type === 'image_note') {
                        contentBody = `<div class="mt-4 flex flex-col h-full overflow-hidden">
                            <div class="h-40 w-full overflow-hidden rounded-xl mb-3 border border-white/10 cursor-zoom-in bg-black/20" onclick="viewFullImage('${item.image}')"><img src="${item.image}" class="w-full h-full object-cover"></div>
                            <div class="note-display-box h-24 mb-2 scrollbar-hide">${item.content}</div><button onclick="copyVal(${rIndex}, 'content', this)" class="w-full py-3 border rounded-xl text-[9px] font-bold uppercase transition hover:bg-white hover:text-black" style="color:var(--accent); border-color:var(--accent)">Copy Note</button>
                        </div>`;
                    } else if(mInfo.type === 'note') {
                        contentBody = `<div class="mt-4 flex flex-col h-full"><div class="note-display-box mb-4 scrollbar-hide">${item.content}</div><button onclick="copyVal(${rIndex}, 'content', this)" class="w-full py-3 border rounded-xl text-[9px] font-bold uppercase shadow-lg transition hover:bg-white hover:text-black" style="color:var(--accent); border-color:var(--accent)"><i class="fas fa-copy mr-2"></i> Copy Full Note</button></div>`;
                    }
                    card.innerHTML = `<div class="flex justify-between items-center pb-3 border-b border-white/10"><h3 class="font-master text-[10px] uppercase truncate italic">${item.title}</h3><div class="flex gap-3"><button onclick="edit(${rIndex})"><i class="fas fa-pen-nib opacity-20 hover:opacity-100"></i></button><button onclick="del(${rIndex})"><i class="fas fa-trash-alt opacity-20 hover:opacity-100"></i></button></div></div>${contentBody}`;
                }
                grid.appendChild(card);
            });
            document.getElementById('emptyState').classList.toggle('hidden', filtered.length > 0);
        }

        function renderSettings() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = `<div class="master-card h-auto p-12 space-y-8 max-w-2xl shadow-2xl">
                <h3 class="font-master text-lg border-b border-white/10 pb-6 uppercase" style="color:var(--accent)">Settings Configuration</h3>
                <div class="grid grid-cols-2 gap-6">
                    <input type="text" id="setNewUser" value="${MASTER_USER}" class="display-input-box text-white text-sm uppercase" placeholder="Master User">
                    <input type="text" id="setNewPass" value="${MASTER_PASS}" class="display-input-box text-white text-sm uppercase" placeholder="Master Pass">
                </div>
                <input type="text" id="setNewBgLogin" value="${BG_LOGIN}" class="display-input-box text-white text-xs" placeholder="Background Login URL (HD)">
                <input type="text" id="setNewBgDash" value="${BG_DASH}" class="display-input-box text-white text-xs" placeholder="Background Dashboard URL (HD)">
                <div class="flex items-center justify-between p-6 bg-white/5 rounded-2xl">
                    <span class="text-xs font-bold uppercase tracking-widest">Interface Theme</span>
                    <div class="flex gap-4">
                        <button onclick="setTheme('dark')" class="px-6 py-3 rounded-lg text-[10px] font-black border ${THEME === 'dark' ? 'bg-yellow-400 text-black border-yellow-400' : 'text-gray-400 border-white/10'}">DARK NEON</button>
                        <button onclick="setTheme('gold')" class="px-6 py-3 rounded-lg text-[10px] font-black border ${THEME === 'gold' ? 'bg-[#d4af37] text-black border-[#d4af37]' : 'text-gray-400 border-white/10'}">LUXURY GOLD</button>
                    </div>
                </div>
                <button onclick="saveSettings()" class="w-full py-5 text-black font-black rounded-xl uppercase text-[12px] tracking-widest" style="background:var(--accent)">Execute Changes</button>
            </div>`;
        }

        function setTheme(t) { THEME = t; renderSettings(); applySettings(); syncToFirebase(); }
        function saveSettings() { MASTER_USER = document.getElementById('setNewUser').value; MASTER_PASS = document.getElementById('setNewPass').value; BG_LOGIN = document.getElementById('setNewBgLogin').value; BG_DASH = document.getElementById('setNewBgDash').value; syncToFirebase(); alert("Settings Applied Successfully!"); }
        function logout() { location.reload(); }

        function openDataModal(index = null) {
            const isEdit = index !== null;
            let m;
            if(activeMenu === 'ALARM CENTER') { m = { name: 'ALARM CENTER', type: 'alarm' }; } 
            else { m = menus.find(mn => mn.name === activeMenu); }
            
            document.getElementById('editIndex').value = isEdit ? index : '';
            document.getElementById('accountFields').classList.toggle('hidden', m.type !== 'account');
            document.getElementById('lotteryFields').classList.toggle('hidden', m.type !== 'lottery');
            document.getElementById('alarmFields').classList.toggle('hidden', m.type !== 'alarm');
            document.getElementById('noteFields').classList.toggle('hidden', !['note', 'image_note'].includes(m.type));
            document.getElementById('imageFields').classList.toggle('hidden', !m.type.includes('image'));
            document.getElementById('inputLink').classList.toggle('hidden', !['account', 'lottery'].includes(m.type));

            if(isEdit) {
                const d = masterData[index]; document.getElementById('inputTitle').value = d.title; document.getElementById('inputUser').value = d.user || '';
                document.getElementById('inputPass').value = d.pass || ''; document.getElementById('inputLink').value = d.link || '';
                document.getElementById('inputContent').value = d.content || ''; document.getElementById('inputClose').value = d.closeTime || '';
                document.getElementById('inputResult').value = d.resultTime || ''; 
                document.getElementById('inputAlarmTime').value = d.alarmTime || ''; document.getElementById('inputDay').value = d.day || 'DAILY';
            }
            document.getElementById('dataModal').classList.remove('hidden');
        }

        const toBase64 = f => new Promise((res, rej) => { const r = new FileReader(); r.readAsDataURL(f); r.onload = () => res(r.result); r.onerror = e => rej(e); });

        document.getElementById('vaultForm').onsubmit = async function(e) {
            e.preventDefault(); const btn = document.getElementById('btnSave'); btn.innerText = 'EXECUTING...';
            const editIdx = document.getElementById('editIndex').value; const file = document.getElementById('inputImageFile').files[0];
            let imgData = editIdx !== '' ? (masterData[editIdx].image || '') : ''; if(file) imgData = await toBase64(file);
            let obj = { category: activeMenu, title: document.getElementById('inputTitle').value || '', user: document.getElementById('inputUser').value || '', pass: document.getElementById('inputPass').value || '', link: document.getElementById('inputLink').value || '', content: document.getElementById('inputContent').value || '', closeTime: document.getElementById('inputClose').value || '', resultTime: document.getElementById('inputResult').value || '', alarmTime: document.getElementById('inputAlarmTime').value || '', day: document.getElementById('inputDay').value || 'DAILY', isDone: editIdx !== '' ? (masterData[editIdx].isDone || false) : false, isHidden: editIdx !== '' ? (masterData[editIdx].isHidden || false) : false, image: imgData };
            if(editIdx !== '') masterData[editIdx] = obj; else masterData.push(obj);
            try { await db.ref('vault_v10').set({ menus, masterData, settings: { user: MASTER_USER, pass: MASTER_PASS, bgLogin: BG_LOGIN, bgDash: BG_DASH, theme: THEME } }); closeDataModal(); } catch(err) { alert('Error: ' + err.message); }
            btn.innerText = 'Save Configuration';
        };

        function closeDataModal() { document.getElementById('dataModal').classList.add('hidden'); document.getElementById('vaultForm').reset(); }
        function addNewMenu() {
            const name = document.getElementById('newMenuName').value.trim().toUpperCase();
            if(name && !menus.find(m => m.name === name)) { 
                menus.push({ name, type: document.getElementById('newMenuType').value }); syncToFirebase(); 
                document.getElementById('menuModal').classList.add('hidden'); 
            }
        }
        function deleteMenu(name) { if(confirm('Hapus Folder?')) { menus = menus.filter(m => m.name !== name); syncToFirebase(); } }
        function del(idx) { if(confirm('Hapus Data Permanen?')) { masterData.splice(idx, 1); syncToFirebase(); } }
        function edit(idx) { openDataModal(idx); }
        function copyVal(idx, f, b) { navigator.clipboard.writeText(masterData[idx][f]); b.innerHTML = '<i class="fas fa-check text-green-500"></i>'; setTimeout(() => b.innerHTML = '<i class="fas fa-clone"></i>', 1000); }
        function openMenuModal() { document.getElementById('menuModal').classList.remove('hidden'); }
        function closeMenuModal() { document.getElementById('menuModal').classList.add('hidden'); }

        // REVISI: TIMER DIPERBESAR DI WIDGET & TAMBAH SPASI DALAM KURUNG
        function updateSummaryWidget(filteredData) {
            const widget = document.getElementById('summaryWidget');
            const content = document.getElementById('summaryWidgetContent');
            widget.classList.remove('hidden');
            const visible = filteredData.filter(d => !d.isHidden);
            const doneCount = visible.filter(d => d.isDone).length;
            const now = new Date();
            const upcoming = visible.filter(item => {
                if(!item.resultTime) return false;
                const [h, m] = item.resultTime.split(':').map(Number);
                const target = new Date(); target.setHours(h, m, 0);
                let diff = (target - now) / 1000 / 60;
                return diff > 0 && diff <= 30;
            }).slice(0, 3);
            
            let upcomingHtml = upcoming.map(u => {
                const [h, m] = u.resultTime.split(':').map(Number);
                const t = new Date(); t.setHours(h, m, 0);
                let diff = Math.floor((t - now) / 1000);
                let cdText = "";
                if(diff > 0) {
                    const mm = Math.floor(diff / 60);
                    const ss = diff % 60;
                    // REVISI: TAMBAH SPASI ( ${waktu} )
                    cdText = `<span class="ml-4 text-white bg-red-600 px-3 py-1 rounded-md font-black shadow-lg text-[14px]">( ${mm}:${ss < 10 ? '0' : ''}${ss} )</span>`;
                }
                return `<div class="flex items-center text-white border-l-2 border-yellow-400 pl-4 py-2">${u.title} ${cdText}</div>`;
            }).join('');
            
            content.innerHTML = `
                <div class="mb-5 text-gray-400">${doneCount} PASAREAN DONE RESULT</div>
                <div class="pt-6 border-t border-white/10">
                    <div style="color:var(--accent)" class="mb-5">NEXT RESULT </div>
                    <div class="space-y-4 text-xs">
                        ${upcomingHtml || '<div class="text-gray-600 italic tracking-widest opacity-40">-- TIDAK ADA DATA --</div>'}
                    </div>
                </div>`;
        }

        function updateTimers() {
            const now = new Date();
            masterData.forEach((item, idx) => {
                const badge = document.getElementById(`tm-${idx}`);
                if(!badge || item.isHidden) return;
                const [h, m] = (item.resultTime || "00:00").split(':').map(Number);
                const target = new Date(); target.setHours(h, m, 0);
                let diff = Math.floor((target - now) / 1000);
                if(diff > 0 && diff <= 1800) {
                    const mm = Math.floor(diff / 60); const ss = diff % 60;
                    // REVISI: TAMBAH SPASI ( ${waktu} )
                    badge.innerHTML = `<span class="countdown-badge">( ${mm}:${ss < 10 ? '0' : ''}${ss} )</span>`;
                } else { badge.innerHTML = ''; }
            });
        }

        let alertedList = new Set();
        function checkAlarms() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const curHHMM = `${h}:${m}`;
            
            const dayNames = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const curDay = dayNames[now.getDay()];

            masterData.forEach(item => {
                if(item.isHidden) return;

                if(menus.find(m => m.name === item.category)?.type === 'lottery') {
                    if(item.resultTime === curHHMM && !alertedList.has(item.title + curHHMM)) {
                        alertedList.add(item.title + curHHMM);
                        triggerAlarm(item, "LOTTERY RESULT");
                    }
                }
                
                if(item.category === 'ALARM CENTER') {
                    if(item.alarmTime === curHHMM && !alertedList.has(item.title + curHHMM)) {
                        if(item.day === 'DAILY' || item.day === curDay) {
                            alertedList.add(item.title + curHHMM);
                            triggerAlarm(item, "GAS");
                        }
                    }
                }
            });

            if(now.getSeconds() === 0) alertedList.clear();
        }

        function closeAlarmToast() {
            document.getElementById('alarmToast').style.display = 'none';
        }

        function triggerAlarm(item, type) {
            const toast = document.getElementById('alarmToast');
            const msg = document.getElementById('notifMsg');
            const next = document.getElementById('notifNext');
            
            document.getElementById('notifType').innerText = type;
            msg.innerText = item.title.toUpperCase() + " COY!";

            const now = new Date();
            const upcomingNext = masterData.filter(d => !d.isHidden && menus.find(m => m.name === d.category)?.type === 'lottery').find(d => {
                if(!d.resultTime) return false;
                const [h, m] = d.resultTime.split(':').map(Number);
                const t = new Date(); t.setHours(h, m, 0);
                let df = (t - now) / 1000 / 60;
                return df > 0 && df <= 5;
            });

            next.innerText = upcomingNext ? `BERIKUTNYA: ${upcomingNext.title} (SEGERA)` : "-- TIDAK ADA RESULT DALAM 30 MENIT KEDEPAN--";
            
            toast.style.display = 'block';
            try { 
                const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.play(); 
            } catch(e){}
            
            setTimeout(() => { 
                if(toast.style.display !== 'none') toast.style.display = 'none'; 
            }, 90000);
        }

        syncFromFirebase();
    </script>
</body>
</html>

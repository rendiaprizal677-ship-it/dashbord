<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENDI APRIZAL - SUPREME VAULT v10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-yellow: #facc15;
            --neon-blue: #0ea5e9;
            --primary-bg: #020617;
        }

        /* DYNAMIC BACKGROUND SYSTEM */
        #dynamicBg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: 1s ease-in-out;
        }

        #bgOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(rgba(2, 6, 23, 0.94), rgba(2, 6, 23, 0.98));
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .font-master { font-family: 'Orbitron', sans-serif; }
        .font-code { font-family: 'JetBrains Mono', monospace; }

        /* NEON LED FLOW BORDER */
        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .neon-flow {
            position: relative;
            background: rgba(10, 10, 15, 0.9);
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        .neon-flow::after {
            content: "";
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            z-index: -1;
            background: linear-gradient(90deg, #facc15, #0ea5e9, #facc15);
            background-size: 200% 200%;
            animation: borderFlow 3s linear infinite;
            border-radius: inherit;
        }

        /* LUXURY SIDEBAR MENU */
        .sidebar-luxury {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 700;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 3px solid transparent;
        }

        .sidebar-luxury.active {
            color: var(--neon-yellow);
            background: linear-gradient(90deg, rgba(250, 204, 21, 0.15) 0%, transparent 100%);
            border-left: 3px solid var(--neon-yellow);
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.8);
        }

        /* CARDS BREATHING */
        @keyframes breathing {
            0%, 100% { box-shadow: 0 0 10px rgba(250, 204, 21, 0.1); border-color: rgba(255,255,255,0.05); }
            50% { box-shadow: 0 0 25px rgba(250, 204, 21, 0.3); border-color: var(--neon-yellow); }
        }

        .master-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            animation: breathing 6s infinite;
        }

        .neon-clock {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-yellow);
            text-shadow: 0 0 20px rgba(250, 204, 21, 0.8);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--neon-yellow); border-radius: 10px; }

        #loginScreen {
            z-index: 9999;
            background-color: #000;
        }

        .input-master {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            transition: 0.3s;
        }

        .input-master:focus {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.2);
        }
    </style>
</head>
<body class="flex">

    <!-- BACKGROUND SYSTEM -->
    <div id="dynamicBg"></div>
    <div id="bgOverlay"></div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 flex items-center justify-center p-6 backdrop-blur-3xl">
        <div class="neon-flow p-12 rounded-[50px] w-full max-w-sm text-center">
            <div class="relative z-10">
                <div class="mb-6 flex justify-center">
                    <div class="w-20 h-20 rounded-full border-2 border-yellow-400 flex items-center justify-center shadow-[0_0_20px_#facc15]">
                        <i class="fas fa-lock-open text-3xl text-yellow-400"></i>
                    </div>
                </div>
                <h1 class="font-master text-2xl font-black mb-1 tracking-[8px]">MASTER <span class="text-yellow-400">VAULT</span></h1>
                <p class="text-[8px] tracking-[0.5em] text-gray-500 mb-10 uppercase font-bold">Authorized Access: R. Aprizal</p>
                
                <div class="space-y-4 text-left">
                    <input type="text" id="loginUser" placeholder="USERNAME" class="w-full bg-black/50 border border-white/10 p-4 rounded-2xl outline-none focus:border-yellow-400 text-white font-bold tracking-widest text-xs uppercase">
                    <input type="password" id="loginPass" placeholder="PASSWORD" class="w-full bg-black/50 border border-white/10 p-4 rounded-2xl outline-none focus:border-yellow-400 text-white font-bold tracking-widest text-xs uppercase">
                    <button onclick="handleLogin()" class="w-full py-4 rounded-2xl bg-yellow-400 text-black font-black uppercase text-[10px] tracking-widest mt-6 shadow-[0_0_15px_#facc15]">Authorize Terminal</button>
                </div>
                <p id="loginError" class="text-red-500 mt-6 text-[10px] hidden font-bold animate-pulse">ERROR: ACCESS DENIED!</p>
            </div>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside class="w-80 h-screen bg-black/40 backdrop-blur-3xl flex flex-col border-r border-white/5 z-50">
        <div class="p-10 border-b border-white/5 bg-white/5 text-center">
            <div class="inline-block px-3 py-1 bg-yellow-400 text-black text-[8px] font-black rounded-full mb-3 tracking-[3px]">VIP ACCOUNT</div>
            <h2 class="font-master text-xl font-black text-white tracking-tighter uppercase" style="text-shadow: 0 0 10px #fff;">RENDI APRIZAL</h2>
            <div class="flex items-center justify-center gap-2 mt-4">
                <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                <p class="text-[8px] font-bold text-gray-500 uppercase tracking-widest italic">Haki System Online</p>
            </div>
        </div>

        <div class="flex-grow overflow-y-auto custom-scrollbar p-6" id="sidebarMenu">
            <!-- Folders here -->
        </div>

        <div class="p-8 space-y-3 border-t border-white/5">
            <button onclick="openMenuModal()" class="w-full py-3.5 rounded-xl border border-yellow-400/30 text-yellow-400 text-[9px] font-bold tracking-[3px] hover:bg-yellow-400 hover:text-black transition uppercase">
                <i class="fas fa-folder-plus mr-2"></i> New Folder
            </button>
            <button onclick="switchMenu('SETTINGS')" class="w-full py-3.5 bg-blue-600/10 text-blue-400 rounded-xl hover:bg-blue-600 hover:text-white transition text-[9px] font-bold tracking-[3px] uppercase">
                <i class="fas fa-cog mr-2"></i> Settings
            </button>
            <button onclick="logout()" class="w-full py-2 text-[8px] text-gray-600 font-bold uppercase tracking-widest hover:text-red-500 transition text-center">
                Logout Terminal
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-grow h-screen overflow-y-auto custom-scrollbar p-12">
        <!-- HEADER -->
        <div class="flex justify-between items-start mb-12">
            <div>
                <h1 id="currentMenuTitle" class="font-master text-5xl font-black text-white uppercase tracking-tighter italic">VAULT</h1>
                <div id="menuUnderline" class="h-1 w-24 bg-yellow-400 mt-2 shadow-[0_0_15px_#facc15]"></div>
            </div>

            <div class="text-right bg-white/5 backdrop-blur-xl px-8 py-4 rounded-3xl border border-white/10">
                <div id="clockTime" class="neon-clock text-3xl font-black tracking-widest">00:00:00</div>
                <div id="clockDate" class="text-[10px] text-gray-500 font-bold uppercase tracking-[4px] mt-1">1 JANUARI 2024</div>
            </div>
        </div>

        <!-- SEARCH AREA -->
        <div id="searchArea" class="flex flex-col lg:flex-row justify-between items-center mb-12 gap-6">
            <div class="relative w-full lg:w-[450px]">
                <input type="text" id="searchInput" oninput="renderCards()" placeholder="Search Data Master..." class="w-full bg-black/40 border border-white/10 pl-14 pr-4 py-4 rounded-2xl outline-none focus:border-yellow-400 text-xs font-bold transition shadow-2xl">
                <i class="fas fa-search absolute left-5 top-5 text-yellow-400 text-lg"></i>
            </div>
            <button onclick="openDataModal()" class="bg-yellow-400 text-black px-12 py-4 rounded-2xl font-black hover:bg-white transition shadow-xl text-[10px] uppercase tracking-widest">
                <i class="fas fa-plus-circle mr-2"></i> Add Entry
            </button>
        </div>

        <!-- CONTENT GRID / SETTINGS VIEW -->
        <div id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Render Cards or Settings -->
        </div>

        <div id="emptyState" class="hidden text-center py-40 opacity-10 font-master text-4xl">DATABASE EMPTY</div>
    </main>

    <!-- MODAL FOLDER -->
    <div id="menuModal" class="fixed inset-0 bg-black/98 hidden z-[1001] flex items-center justify-center p-6">
        <div class="neon-flow p-10 rounded-[50px] w-full max-w-sm text-center">
            <h3 class="font-master text-lg font-black text-white mb-8 tracking-widest uppercase">Create Folder</h3>
            <div class="space-y-4 text-left">
                <input type="text" id="newMenuName" placeholder="FOLDER NAME" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-yellow-400 font-bold text-white text-sm uppercase">
                <select id="newMenuType" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-yellow-400 font-bold text-yellow-400 text-sm">
                    <option value="account" class="bg-slate-900 font-bold">MODE AKUN (Login & Pass)</option>
                    <option value="note" class="bg-slate-900 font-bold">MODE CATATAN (Teks)</option>
                    <option value="image" class="bg-slate-900 font-bold">MODE GAMBAR (Foto Saja)</option>
                    <option value="image_note" class="bg-slate-900 font-bold">MODE FOTO & TEKS (Lengkap)</option>
                </select>
            </div>
            <button onclick="addNewMenu()" class="w-full py-4 mt-8 bg-yellow-400 text-black font-black rounded-2xl uppercase text-[10px] tracking-widest shadow-lg">Register Folder</button>
            <button onclick="closeMenuModal()" class="mt-4 text-gray-500 text-[9px] font-bold uppercase tracking-widest">Cancel</button>
        </div>
    </div>

    <!-- MODAL DATA -->
    <div id="dataModal" class="fixed inset-0 bg-black/98 hidden z-[1000] flex items-center justify-center p-4">
        <div class="bg-[#050505] border border-yellow-400/30 rounded-[50px] w-full max-w-xl overflow-hidden shadow-2xl">
            <div class="bg-yellow-400 p-6 flex justify-between items-center text-black">
                <h3 id="modalHeaderTitle" class="font-black text-[10px] tracking-widest uppercase italic font-master">Config Master</h3>
                <button onclick="closeDataModal()"><i class="fas fa-times fa-lg"></i></button>
            </div>
            <form id="vaultForm" class="p-10 space-y-6 text-left">
                <input type="hidden" id="editIndex">
                <div>
                    <label class="block text-[9px] font-black text-yellow-400 uppercase tracking-widest mb-1.5">Judul Entry</label>
                    <input type="text" id="inputTitle" required class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-yellow-400 text-white font-bold text-sm uppercase italic">
                </div>
                <div id="accountFields" class="hidden grid grid-cols-2 gap-4">
                    <input type="text" id="inputUser" placeholder="USERNAME" class="bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-yellow-400 text-white font-bold text-xs uppercase">
                    <input type="text" id="inputPass" placeholder="PASSWORD" class="bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-yellow-400 text-white font-bold text-xs uppercase">
                </div>
                <div id="imageFields" class="hidden space-y-2">
                    <label class="block text-[9px] font-black text-gray-500 uppercase tracking-widest mb-1">Upload Foto</label>
                    <div class="bg-white/5 border border-dashed border-white/10 p-4 rounded-2xl text-center">
                        <input type="file" id="inputImageFile" accept="image/*" class="text-xs text-gray-400">
                    </div>
                </div>
                <div id="noteFields" class="hidden">
                    <label class="block text-[9px] font-black text-gray-500 uppercase tracking-widest mb-1">Catatan</label>
                    <textarea id="inputContent" rows="6" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-white text-xs font-code custom-scrollbar"></textarea>
                </div>
                <button type="submit" class="w-full py-5 bg-yellow-400 text-black font-black rounded-2xl uppercase text-[10px] tracking-[4px] shadow-2xl">Commit to Vault</button>
            </form>
        </div>
    </div>

    <script>
        // --- STORAGE & SETTINGS SYSTEM ---
        let MASTER_USER = localStorage.getItem('v10_user') || "admin";
        let MASTER_PASS = localStorage.getItem('v10_pass') || "master123";
        let BG_URL = localStorage.getItem('v10_bg') || "https://wallpapercave.com/wp/wp12204737.jpg";

        function applySettings() {
            document.getElementById('dynamicBg').style.backgroundImage = `url('${BG_URL}')`;
            document.getElementById('loginScreen').style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('${BG_URL}')`;
            document.getElementById('loginScreen').style.backgroundSize = "cover";
            document.getElementById('loginScreen').style.backgroundPosition = "center";
        }

        function handleLogin() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            if(u === MASTER_USER && p === MASTER_PASS) {
                document.getElementById('loginScreen').style.display = 'none';
            } else { document.getElementById('loginError').classList.remove('hidden'); }
        }

        function logout() { location.reload(); }

        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('clockDate').innerText = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
        }
        setInterval(updateClock, 1000); updateClock();

        // --- CORE DATA LOGIC ---
        let menus = JSON.parse(localStorage.getItem('v10_menus')) || [{ name: "DATA LOGIN", type: "account" }];
        let activeMenu = localStorage.getItem('v10_active') || "DATA LOGIN";
        let masterData = JSON.parse(localStorage.getItem('v10_data')) || [];

        function renderSidebar() {
            const container = document.getElementById('sidebarMenu'); container.innerHTML = '';
            menus.forEach(m => {
                const isActive = activeMenu === m.name;
                const div = document.createElement('div');
                div.className = `sidebar-luxury p-5 mb-2 rounded-xl cursor-pointer flex justify-between items-center ${isActive ? 'active' : 'text-gray-500 hover:bg-white/5'}`;
                let icon = m.type === 'account' ? 'fa-shield-alt' : m.type === 'note' ? 'fa-sticky-note' : m.type === 'image' ? 'fa-images' : 'fa-photo-video';
                div.innerHTML = `<span onclick="switchMenu('${m.name}')"><i class="fas ${icon} mr-4"></i> ${m.name}</span>
                                ${m.name !== 'DATA LOGIN' ? `<i onclick="deleteMenu('${m.name}')" class="fas fa-trash-alt text-[8px] opacity-20 hover:opacity-100 hover:text-red-500 transition"></i>` : ''}`;
                container.appendChild(div);
            });
        }

        function switchMenu(name) {
            activeMenu = name;
            localStorage.setItem('v10_active', activeMenu);
            document.getElementById('currentMenuTitle').innerText = activeMenu;
            
            if(activeMenu === 'SETTINGS') {
                document.getElementById('searchArea').classList.add('hidden');
                document.getElementById('cardGrid').classList.replace('grid-cols-1', 'grid-cols-1'); // Reset to single col for settings
                document.getElementById('cardGrid').className = "max-w-4xl mx-auto space-y-8 mt-10";
                renderSettings();
            } else {
                document.getElementById('searchArea').classList.remove('hidden');
                document.getElementById('cardGrid').className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8";
                renderSidebar();
                renderCards();
            }
        }

        function renderCards() {
            const grid = document.getElementById('cardGrid'); const search = document.getElementById('searchInput').value.toLowerCase(); grid.innerHTML = '';
            const mInfo = menus.find(m => m.name === activeMenu);
            if(!mInfo) return;
            const filtered = masterData.filter(d => d.category === activeMenu && d.title.toLowerCase().includes(search));

            filtered.forEach((item, index) => {
                const rIndex = masterData.indexOf(item);
                const card = document.createElement('div');
                card.className = "master-card p-6 rounded-[35px] border border-white/5";
                let body = '';
                if(mInfo.type === 'account') {
                    body = `<div class="space-y-4 mt-6">
                        <div class="bg-black/40 p-4 rounded-xl flex justify-between border border-white/5">
                            <span class="text-xs font-bold text-yellow-400 truncate w-3/4 italic uppercase tracking-widest">${item.user}</span>
                            <button onclick="copyText('${item.user}', this)" class="text-white/20 hover:text-yellow-400"><i class="fas fa-clone"></i></button>
                        </div>
                        <div class="bg-black/40 p-4 rounded-xl flex justify-between border border-white/5">
                            <span class="text-xs font-bold text-yellow-400">********</span>
                            <button onclick="copyText('${item.pass}', this)" class="text-white/20 hover:text-yellow-400"><i class="fas fa-clone"></i></button>
                        </div>
                    </div>`;
                } else if(mInfo.type === 'note') {
                    body = `<div class="mt-6 p-5 bg-black/40 rounded-2xl text-[11px] text-gray-400 italic line-clamp-6 text-left border border-white/5 font-code leading-relaxed">${item.content}</div>`;
                } else if(mInfo.type.includes('image')) {
                    body = `<div class="relative w-full h-44 mt-6 rounded-3xl overflow-hidden shadow-2xl border border-white/10 group">
                                <img src="${item.image || 'https://via.placeholder.com/400x200'}" class="w-full h-full object-cover">
                                <button onclick="copyImageToClipboard('${item.image}', this)" class="absolute top-2 right-2 bg-black/80 p-2.5 rounded-xl text-[9px] font-bold border border-white/20 hover:bg-yellow-400 hover:text-black transition">
                                    <i class="fas fa-copy mr-1"></i> COPY FOTO
                                </button>
                            </div>
                            ${mInfo.type === 'image_note' ? `<div class="mt-4 p-4 bg-black/40 rounded-xl text-[10px] text-gray-400 italic line-clamp-3 text-left border border-white/5">${item.content}</div>` : ''}`;
                }
                card.innerHTML = `<div class="flex justify-between items-start"><h3 class="font-master text-white font-black text-xs uppercase truncate pr-4 italic tracking-tighter">${item.title}</h3><div class="flex gap-4"><button onclick="edit(${rIndex})" class="text-white/20 hover:text-yellow-400"><i class="fas fa-pen-nib"></i></button><button onclick="del(${rIndex})" class="text-white/20 hover:text-red-500"><i class="fas fa-trash-alt"></i></button></div></div>${body}`;
                grid.appendChild(card);
            });
            document.getElementById('emptyState').classList.toggle('hidden', filtered.length > 0);
        }

        // --- SETTINGS VIEW LOGIC ---
        function renderSettings() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = `
                <div class="glass-panel p-10 rounded-[40px] border border-white/10 shadow-2xl">
                    <h3 class="font-master text-xl font-black text-yellow-400 mb-8 tracking-widest uppercase italic">Master Credentials</h3>
                    <div class="grid grid-cols-2 gap-8">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3">Update Master Username</label>
                            <input type="text" id="setNewUser" value="${MASTER_USER}" class="w-full input-master p-4 rounded-2xl text-white font-bold">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3">Update Master Password</label>
                            <input type="text" id="setNewPass" value="${MASTER_PASS}" class="w-full input-master p-4 rounded-2xl text-white font-bold">
                        </div>
                    </div>
                    <button onclick="updateCredentials()" class="mt-8 bg-yellow-400 text-black px-10 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-white transition">Update Access Key</button>
                </div>

                <div class="glass-panel p-10 rounded-[40px] border border-white/10 shadow-2xl">
                    <h3 class="font-master text-xl font-black text-blue-400 mb-8 tracking-widest uppercase italic">Visual Customization</h3>
                    <div class="space-y-6">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3 text-left">Master Background URL</label>
                            <input type="text" id="setNewBg" value="${BG_URL}" placeholder="Paste Image URL here..." class="w-full input-master p-4 rounded-2xl text-white text-xs">
                        </div>
                        <p class="text-[9px] text-gray-500 italic">Input URL gambar 4K agar tampilan dashboard Anda tetap tajam dan mewah.</p>
                    </div>
                    <button onclick="updateBackground()" class="mt-8 bg-blue-500 text-white px-10 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-white hover:text-black transition">Set Master Background</button>
                </div>
            `;
            renderSidebar();
        }

        function updateCredentials() {
            const newUser = document.getElementById('setNewUser').value.trim();
            const newPass = document.getElementById('setNewPass').value.trim();
            if(newUser && newPass) {
                MASTER_USER = newUser; MASTER_PASS = newPass;
                localStorage.setItem('v10_user', MASTER_USER);
                localStorage.setItem('v10_pass', MASTER_PASS);
                alert("Credentials Updated Successfully! Use new keys for next login.");
            }
        }

        function updateBackground() {
            const newBg = document.getElementById('setNewBg').value.trim();
            if(newBg) {
                BG_URL = newBg;
                localStorage.setItem('v10_bg', BG_URL);
                applySettings();
                alert("Master Background Updated!");
            }
        }

        // --- UTILS ---
        async function copyImageToClipboard(base64Data, btn) {
            try {
                const response = await fetch(base64Data);
                const blob = await response.blob();
                const item = new ClipboardItem({ [blob.type]: blob });
                await navigator.clipboard.write([item]);
                showBtnSuccess(btn, 'COPIED!');
            } catch (err) {
                if(confirm("Browser memblokir Salin Gambar Otomatis. Download foto atau Klik Kanan > Salin Gambar secara manual?")) {
                    const a = document.createElement('a'); a.href = base64Data; a.download = "master_image.png"; a.click();
                }
            }
        }

        function showBtnSuccess(btn, msg) {
            const original = btn.innerHTML; btn.innerHTML = `<i class="fas fa-check"></i> ${msg}`;
            btn.style.background = '#22c55e';
            setTimeout(() => { btn.innerHTML = original; btn.style.background = ''; }, 1500);
        }

        async function copyText(txt, btn) {
            navigator.clipboard.writeText(txt);
            const icon = btn.querySelector('i'); icon.className = 'fas fa-check text-green-500';
            setTimeout(() => icon.className = 'fas fa-clone', 1000);
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result); reader.onerror = error => reject(error);
        });

        // --- MODAL LOGIC ---
        function openDataModal(index = null) {
            const isEdit = index !== null; const t = menus.find(m => m.name === activeMenu).type; 
            document.getElementById('editIndex').value = isEdit ? index : '';
            document.getElementById('accountFields').classList.toggle('hidden', t !== 'account');
            document.getElementById('imageFields').classList.toggle('hidden', !t.includes('image'));
            document.getElementById('noteFields').classList.toggle('hidden', t === 'account' || t === 'image');
            if(isEdit) {
                const d = masterData[index]; document.getElementById('inputTitle').value = d.title;
                if(t === 'account') { document.getElementById('inputUser').value = d.user; document.getElementById('inputPass').value = d.pass; }
                if(t === 'note' || t === 'image_note') document.getElementById('inputContent').value = d.content;
            }
            document.getElementById('dataModal').classList.remove('hidden');
        }

        function closeDataModal() { document.getElementById('dataModal').classList.add('hidden'); document.getElementById('vaultForm').reset(); }
        
        document.getElementById('vaultForm').onsubmit = async function(e) {
            e.preventDefault(); const editIdx = document.getElementById('editIndex').value;
            const t = menus.find(m => m.name === activeMenu).type;
            let imageData = editIdx !== "" ? masterData[editIdx].image : "";
            const file = document.getElementById('inputImageFile').files[0];
            if(file) imageData = await toBase64(file);
            let obj = { category: activeMenu, title: document.getElementById('inputTitle').value, user: document.getElementById('inputUser').value, pass: document.getElementById('inputPass').value, image: imageData, content: document.getElementById('inputContent').value };
            if(editIdx !== '') masterData[editIdx] = obj; else masterData.push(obj);
            localStorage.setItem('v10_data', JSON.stringify(masterData)); renderCards(); closeDataModal();
        };

        function openMenuModal() { document.getElementById('menuModal').classList.remove('hidden'); }
        function closeMenuModal() { document.getElementById('menuModal').classList.add('hidden'); }
        
        function addNewMenu() {
            const name = document.getElementById('newMenuName').value.trim().toUpperCase(); const type = document.getElementById('newMenuType').value;
            if(name && !menus.find(m => m.name === name)) {
                menus.push({ name, type }); localStorage.setItem('v10_menus', JSON.stringify(menus));
                switchMenu(name); closeMenuModal(); document.getElementById('newMenuName').value = '';
            }
        }

        function deleteMenu(name) {
            if(confirm(`Erase folder ${name} permanently?`)) {
                menus = menus.filter(m => m.name !== name); masterData = masterData.filter(d => d.category !== name);
                localStorage.setItem('v10_menus', JSON.stringify(menus)); localStorage.setItem('v10_data', JSON.stringify(masterData));
                switchMenu("DATA LOGIN");
            }
        }

        function del(idx) { if(confirm('Delete data?')) { masterData.splice(idx, 1); localStorage.setItem('v10_data', JSON.stringify(masterData)); renderCards(); } }
        function edit(idx) { openDataModal(idx); }

        // --- INIT ---
        applySettings();
        renderSidebar(); 
        switchMenu(activeMenu);
    </script>
</body>
</html>
